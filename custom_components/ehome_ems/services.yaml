generate_dashboard:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: ehome_ems
    language:
      selector:
        select:
          options:
            - fr
            - en
    max_power_w:
      default: 10000
      selector:
        number:
          min: 100
          max: 1000000
          mode: box
          unit_of_measurement: W
