<script type="module">
import "../../custom_components/ehome_ems/frontend/ehome-panel.mjs";

 const path=document.createElementNS(svg.namespaceURI,"path");path.setAttribute("d",icons[this.getAttribute("icon")]||"");svg.append(path);this.replaceChildren(svg);}
});
const dashboard = {title:"eHome EMS",views:[
 {title:"Synthèse",path:"summary",cards:[

  {type:"entities",title:"Puissances",entities:[
   {entity:"sensor.pv",name:"Production solaire"},{entity:"sensor.home",name:"Maison"},{entity:"sensor.grid",name:"Réseau signé"}]},
  {type:"grid",cards:[{type:"gauge",entity:"sensor.pv",name:"Production solaire",min:0,max:3000},
    {type:"gauge",entity:"sensor.home",name:"Maison",min:0,max:3000}]}]},
 {title:"Stockage",path:"storage",cards:[{type:"entities",title:"Batterie principale · Active · AC",
   entities:[{entity:"sensor.soc",name:"État de charge"}]}]},
 {title:"Usages",path:"usages",cards:[{type:"entities",title:"Recharge véhicule",entities:[{entity:"sensor.ev",name:"Puissance"}]}]},
 {title:"Historique",path:"history",cards:[{type:"history-graph",title:"Puissances",entities:["sensor.pv","sensor.home"]}]},
 {title:"Qualité des données",path:"quality",cards:[{type:"entities",entities:[{type:"attribute",entity:"sensor.pv",attribute:"data_quality",name:"Solaire"}]}]}
]};
window.calls=[];
const bindings={"sensor.pv":{source:"sensor.pv_source",domains:["sensor"],units:["W","kW"],calculated_home:false}};
let revision="one";
let simulation={schema_version:1,mode:"manual_scenario",targets:[
 {id:"battery:a",name:"Zendure",kind:"battery",enabled:false,min_w:0,max_w:0},
 {id:"usage:b",name:"Cumulus",kind:"solar_router",enabled:false,min_w:0,max_w:0},
 {id:"usage:c",name:"Véhicule",kind:"ev_charger",enabled:false,min_w:0,max_w:0}]};
const simulation_history=[];
const settings={weather_entity:"weather.home",home_power:"sensor.home",usages:{d:{name:"Frigo",kind:"appliance",power:"sensor.fridge",energy:"sensor.fridge_energy",energy_period:"today",included_in_home:true}},batteries:{}};
const flow=window.fixtureFlow={entities:{solar_power:"sensor.pv",home_power:"sensor.home",grid_import:"sensor.import",grid_export:"sensor.export"},
 home_calculated:true,batteries:[{id:"a",name:"Zendure",role:"active",coupling:"ac",charge_power:"sensor.charge",discharge_power:"sensor.discharge",soc:"sensor.soc",remaining_energy:"sensor.stock"},{id:"backup",name:"Aferiy",role:"backup",coupling:"ac",charge_power:"sensor.aferiy_in",discharge_power:"sensor.aferiy_out",soc:"sensor.aferiy_soc",remaining_energy:"sensor.aferiy_stock"}],
 usages:[{id:"b",name:"Cumulus",kind:"solar_router",power:"sensor.cumulus",temperature:"sensor.water_temp",energy:"sensor.water_energy",energy_period:"today"},{id:"c",name:"Véhicule",kind:"ev_charger",power:"sensor.ev"},{id:"d",name:"Frigo",kind:"appliance",power:"sensor.fridge",energy:"sensor.fridge_energy",energy_period:"today"}]};
flow.usages.push({id:"washer",name:"Lave-linge · buanderie",kind:"appliance",power:"sensor.washer",energy:"sensor.washer_energy",energy_period:"total"},{id:"ac",name:"Climatisation atelier",kind:"appliance",power:"sensor.ac",energy_period:"total"});
Object.assign(settings,{solar_power:"sensor.pv_source",grid_import:"sensor.import",grid_export:"sensor.export",home_power_mode:"existing"});
for(const b of flow.batteries)settings.batteries[b.id]={...b};
flow.photovoltaic=[{id:"pv-demo",name:"Micro-onduleur Démo",kind:"micro_inverter",manufacturer:"Démonstration",model:"800",nominal_power_w:800,power:"sensor.pv_device",energy:"sensor.pv_device_energy",energy_period:"total"}];
settings.photovoltaic={"pv-demo":{...flow.photovoltaic[0]}};
for(const u of flow.usages){if(u.id==="b")u.daily_energy_goal_kwh=3;if(u.id==="d"){u.control_entity="switch.fridge";u.control_enabled=true;}settings.usages[u.id]={...u,included_in_home:true};}
window.fixtureHass={
 callApi:async(method,path)=>{
  const url=new URL(path,"http://fixture/"),ids=url.searchParams.get("filter_entity_id").split(","),start=Date.parse(url.pathname.split("/period/")[1]);
  if(ids.some(id=>id.endsWith("_energy")))return ids.filter(id=>id==="sensor.fridge_energy"||id==="sensor.water_energy"||id==="sensor.pv_device_energy").map(id=>[{entity_id:id,state:id==="sensor.fridge_energy"?"1524":id==="sensor.pv_device_energy"?"1000":"0",attributes:{unit_of_measurement:"kWh"},last_changed:new Date(start).toISOString()}]);
  const fullDay=Date.now()-start>23*3600000;
  return (fullDay?ids:["sensor.pv_source"]).map((id,j)=>Array.from({length:fullDay?97:25},(_,i)=>({entity_id:id,state:fullDay&&i===40?"unavailable":String(Math.max(0,350+j*80+120*Math.sin(i/2))),last_changed:new Date(fullDay?start+i*900000:Date.now()-(24-i)*10*60000).toISOString()})));

 },
 connection:{subscribeMessage:async(callback,command)=>{window.weatherSubscriptions=(window.weatherSubscriptions||0)+1;callback({type:"daily",forecast:[{datetime:new Date().toISOString(),condition:"partlycloudy",temperature:19,templow:9,precipitation:.4,precipitation_probability:12.6}]});return()=>{window.weatherUnsubscriptions=(window.weatherUnsubscriptions||0)+1;};}},

 config:{time_zone:"Europe/Paris"},language:"fr",user:{is_admin:true},states:{
  "sensor.pv":{state:"1500",attributes:{unit_of_measurement:"W",data_quality:"valid",friendly_name:"Production solaire"}},
  "sensor.home":{state:"425",attributes:{unit_of_measurement:"W",friendly_name:"Conso Maison",data_quality:"valid",freshness_check_enabled:true,balance_inputs:[{role:"solar_power",entity_id:"sensor.pv_source",contribution_w:1500,age_seconds:3,quality:"valid"},{role:"grid_export",entity_id:"sensor.export",contribution_w:-75,age_seconds:2,quality:"valid"},{role:"charge_power",entity_id:"sensor.charge",contribution_w:-1000,age_seconds:4,quality:"valid"}]}},
  "sensor.grid":{state:"-47",attributes:{unit_of_measurement:"W"}},
  "sensor.soc":{state:"18",attributes:{unit_of_measurement:"%"}},
  "sensor.ev":{state:"0",attributes:{unit_of_measurement:"W"}}
 },
 callWS:async message=>{
  window.calls.push(message);
  if(message.type==="ehome_ems/dashboard")return {
    dashboard:structuredClone(dashboard),missing_entities:[],bindings:structuredClone(bindings),revision,flow:window.omitFlow?undefined:flow,version:"0.2.4",settings:structuredClone(settings),time_zone:"Europe/Paris",weather_entity:"weather.home",daily:{solar:"sensor.daily_pv",home:"sensor.daily_home",import:"sensor.daily_import",export:"sensor.daily_export"},tariff_eur_kwh:.215,simulation:structuredClone(simulation),simulation_history:structuredClone(simulation_history)};
  if(message.type==="ehome_ems/manage_settings"){
    if(!fixtureHass.user.is_admin)throw {code:"unauthorized"};
    const key=message.identifier||"new-appliance";
    if(["appliances","usages","photovoltaic"].includes(message.section)){
      const pv=message.section==="photovoltaic";
      if(pv){if(message.action==="remove"){delete settings.photovoltaic[key];flow.photovoltaic=flow.photovoltaic.filter(p=>p.id!==key);}else{settings.photovoltaic[key]=message.values;flow.photovoltaic=flow.photovoltaic.filter(p=>p.id!==key);flow.photovoltaic.push({id:key,...message.values});}}
      else{
      if(message.action==="remove"){delete settings.usages[key];flow.usages=flow.usages.filter(u=>u.id!==key);}
      else{const value={...message.values,kind:message.section==="appliances"?"appliance":message.values.kind};settings.usages[key]=value;flow.usages=flow.usages.filter(u=>u.id!==key);flow.usages.push({id:key,...value});}
    }}else if(message.section==="solar")settings.solar_power=message.values.solar_power;
    const native=flow.usages.find(u=>u.id===key);
    if(native?.router_connection==="http"){
      native.router_native={available:true,config_token:"demo-config",actions:[{index:0,name:"Triac démo",mode:2,forced_opening:80,periods:[{Type:4,Hfin:2400,Vmax:70}]}]};
      native.router_entities={connection:"sensor.native_connection",status:"sensor.native_status",opening:"sensor.native_opening",force_minutes:"sensor.native_force",probe_power:"sensor.native_power"};
    }
    revision="settings-"+calls.length;return{updated:true,identifier:key};
  }
  if(message.type==="ehome_ems/router_discover"){
    if(!fixtureHass.user.is_admin)throw {code:"unauthorized"};
    return {config_token:"demo-config",actions:[{index:0,name:"Triac démo",mode:2},{index:1,name:"SSR démo",mode:1}]};
  }
  if(message.type==="ehome_ems/router_command"){
    const usage=flow.usages.find(u=>u.id===message.identifier);
    if(usage?.router_connection==="http"){
      if(!fixtureHass.user.is_admin||!usage.router_http_enabled)throw {code:"unauthorized"};
      return {sent:true,confirmed_by_router:true,persistent:message.action==="http_parameters"};
    }
    if(!fixtureHass.user.is_admin)throw {code:"unauthorized"};
    if(!flow.usages.find(u=>u.id===message.identifier)?.router_mqtt_enabled)throw {code:"router_not_enabled"};
    return {published:true,confirmed_by_router:false};
  }
  if(message.type==="ehome_ems/manual_control"){
    if(!fixtureHass.user.is_admin)throw {code:"unauthorized"};
    const usage=flow.usages.find(u=>u.id===message.identifier),state=fixtureHass.states[usage?.control_entity];
    if(!usage?.control_enabled||!state||state.state!==message.expected_state)throw {code:"state_changed"};
    state.state=message.desired_on?"on":"off";fixturePanel.hass={...fixtureHass};return {command_sent:true};
  }
  if(message.type==="ehome_ems/save_simulation"){
    simulation.targets=message.targets.map(t=>({...simulation.targets.find(old=>old.id===t.id),...t}));revision="scenario-saved";return {updated:true};
  }
  if(message.type==="ehome_ems/simulate"){
    if(message.budget_w!==1500)throw new Error("Fixture supports only the UI reference budget");
    const result={mode:"manual_scenario",budget_w:1500,allocated_w:1000,remaining_w:500,commands_sent:false,created_at:new Date().toISOString(),
      targets:simulation.targets.map(t=>({...t,allocated_w:t.id==="battery:a"?1000:0,reason:t.id==="battery:a"?"ceiling_reached":"disabled"}))};
    simulation_history.push(result);return result;
  }
  if(message.type==="ehome_ems/remap_source"){
    bindings[message.entity_id].source=message.source_id; revision="two";
    const source=fixtureHass.states[message.source_id];
    fixtureHass.states[message.entity_id]={state:source.state,attributes:{
      ...source.attributes,friendly_name:"Production solaire",data_quality:"valid"}};
    fixturePanel.hass={...fixtureHass};return {updated:true};
  }
  return {id:"simulated-copy"};
 }
};
fixtureHass.states["sensor.pv_source"]={state:"1500",attributes:{unit_of_measurement:"W",friendly_name:"Source solaire"}};
fixtureHass.states["sensor.pv_alternative"]={state:"2000",attributes:{unit_of_measurement:"W",friendly_name:"Source alternative"}};
for(const [id,value] of Object.entries({import:0,export:75,charge:1000,discharge:0,cumulus:200}))
 fixtureHass.states["sensor."+id]={state:String(value),attributes:{unit_of_measurement:"W"}};
for(const [id,value,unit] of [["stock",.16,"kWh"],["aferiy_in",0,"W"],["aferiy_out",0,"W"],["aferiy_soc",72,"%"],["aferiy_stock",1.6,"kWh"],["water_temp",51,"°C"],["water_energy",2.16,"kWh"],["fridge",85,"W"],["fridge_energy",1524.81,"kWh"],["daily_pv",2.1,"kWh"],["daily_home",8.176,"kWh"],["daily_import",6.112,"kWh"],["daily_export",.274,"kWh"]])
 fixtureHass.states["sensor."+id]={state:String(value),attributes:{unit_of_measurement:unit}};
fixtureHass.states["sensor.washer"]={state:"0",attributes:{unit_of_measurement:"W"}};
fixtureHass.states["sensor.washer_energy"]={state:"155.38",attributes:{unit_of_measurement:"kWh"}};
fixtureHass.states["sensor.ac"]={state:"unavailable",attributes:{unit_of_measurement:"W"}};
fixtureHass.states["weather.home"]={state:"cloudy",attributes:{friendly_name:"Maison météo",temperature:16,temperature_unit:"°C",precipitation_unit:"mm",supported_features:1}};
fixtureHass.states["switch.fridge"]={state:"on",attributes:{friendly_name:"Commande frigo simulée"}};
for(const [id,value,unit] of [["pv_device",500,"W"],["pv_device_energy",1002.1,"kWh"],["pv_dc",550,"W"],["router_power",200,"W"]])fixtureHass.states["sensor."+id]={state:String(value),attributes:{unit_of_measurement:unit}};
window.fixturePanel=document.querySelector("ehome-ems-panel-0-2-4");
fixturePanel.hass=fixtureHass;fixturePanel.panel={config:{entry_id:"simulated",revision:"one"}};
for(const [id,state,unit] of [["native_connection","online",""],["native_status","auto",""],["native_opening","50","%"],["native_force","0","min"],["native_power","800","W"]])fixtureHass.states["sensor."+id]={state,attributes:{unit_of_measurement:unit}};
</script></html>
