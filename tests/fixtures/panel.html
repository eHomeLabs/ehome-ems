<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>eHome EMS — fixture simulée</title><style>html,body{margin:0;height:100%;--primary-background-color:#101820;--primary-text-color:#eef4fa;--card-background-color:#15222d;--divider-color:#3b536b;--primary-color:#70a246;--text-primary-color:#fff}</style>
<script>customElements.define("ehome-ems-panel",class extends HTMLElement{});</script>
<ehome-ems-panel-0-2-0b11></ehome-ems-panel-0-2-0b11>
<script type="module">
import "../../custom_components/ehome_ems/frontend/ehome-panel.mjs";
const icons=await (await fetch("./mdi.json")).json();
customElements.define("ha-icon",class extends HTMLElement {
 connectedCallback(){const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
 svg.setAttribute("viewBox","0 0 24 24");svg.style.cssText="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:currentColor;vertical-align:middle";
 const path=document.createElementNS(svg.namespaceURI,"path");path.setAttribute("d",icons[this.getAttribute("icon")]||"");svg.append(path);this.replaceChildren(svg);}
});
const dashboard = {title:"eHome EMS",views:[
 {title:"Synthèse",path:"summary",cards:[
  {type:"markdown",content:"Observation · aucune commande. Mesures simulées pour vérifier le rendu."},
  {type:"entities",title:"Puissances",entities:[
   {entity:"sensor.pv",name:"Production solaire"},{entity:"sensor.home",name:"Maison"},{entity:"sensor.grid",name:"Réseau signé"}]},
  {type:"grid",cards:[{type:"gauge",entity:"sensor.pv",name:"Production solaire",min:0,max:3000},
    {type:"gauge",entity:"sensor.home",name:"Maison",min:0,max:3000}]}]},
 {title:"Stockage",path:"storage",cards:[{type:"entities",title:"Batterie principale · Active · AC",
   entities:[{entity:"sensor.soc",name:"État de charge"}]}]},
 {title:"Usages",path:"usages",cards:[{type:"entities",title:"Recharge véhicule",entities:[{entity:"sensor.ev",name:"Puissance"}]}]},
 {title:"Historique",path:"history",cards:[{type:"history-graph",title:"Puissances",entities:["sensor.pv","sensor.home"]}]},
 {title:"Qualité des données",path:"quality",cards:[{type:"entities",entities:[{type:"attribute",entity:"sensor.pv",attribute:"data_quality",name:"Solaire"}]}]}
]};
window.calls=[];
const bindings={"sensor.pv":{source:"sensor.pv_source",domains:["sensor"],units:["W","kW"],calculated_home:false}};
let revision="one";
let simulation={schema_version:1,mode:"manual_scenario",targets:[
 {id:"battery:a",name:"Zendure",kind:"battery",enabled:false,min_w:0,max_w:0},
 {id:"usage:b",name:"Cumulus",kind:"solar_router",enabled:false,min_w:0,max_w:0},
 {id:"usage:c",name:"Véhicule",kind:"ev_charger",enabled:false,min_w:0,max_w:0}]};
const simulation_history=[];
const flow=window.fixtureFlow={entities:{solar_power:"sensor.pv",home_power:"sensor.home",grid_import:"sensor.import",grid_export:"sensor.export"},
 home_calculated:true,batteries:[{name:"Zendure",role:"active",coupling:"ac",charge_power:"sensor.charge",discharge_power:"sensor.discharge",soc:"sensor.soc",remaining_energy:"sensor.stock"},{name:"Aferiy",role:"backup",coupling:"ac",charge_power:"sensor.aferiy_in",discharge_power:"sensor.aferiy_out",soc:"sensor.aferiy_soc",remaining_energy:"sensor.aferiy_stock"}],
 usages:[{name:"Cumulus",kind:"solar_router",power:"sensor.cumulus",temperature:"sensor.water_temp",energy:"sensor.water_energy",energy_period:"today"},{name:"Véhicule",kind:"ev_charger",power:"sensor.ev"},{name:"Frigo",kind:"appliance",power:"sensor.fridge",energy:"sensor.fridge_energy",energy_period:"today"}]};
window.fixtureHass={
 callApi:async()=>[Object.entries(Object.fromEntries(Array.from({length:25},(_,i)=>[i,350+120*Math.sin(i/2)]))).map(([i,value])=>({entity_id:"sensor.pv_source",state:String(value),last_changed:new Date(Date.now()-(24-Number(i))*10*60000).toISOString()}))],
 language:"fr",user:{is_admin:true},states:{
  "sensor.pv":{state:"1500",attributes:{unit_of_measurement:"W",data_quality:"valid",friendly_name:"Production solaire"}},
  "sensor.home":{state:"425",attributes:{unit_of_measurement:"W",friendly_name:"Maison"}},
  "sensor.grid":{state:"-47",attributes:{unit_of_measurement:"W"}},
  "sensor.soc":{state:"18",attributes:{unit_of_measurement:"%"}},
  "sensor.ev":{state:"0",attributes:{unit_of_measurement:"W"}}
 },
 callWS:async message=>{
  window.calls.push(message);
  if(message.type==="ehome_ems/dashboard")return {
    dashboard:structuredClone(dashboard),missing_entities:[],bindings:structuredClone(bindings),revision,flow:window.omitFlow?undefined:flow,version:"0.2.0b11",daily:{solar:"sensor.daily_pv",home:"sensor.daily_home"},tariff_eur_kwh:.215,simulation:structuredClone(simulation),simulation_history:structuredClone(simulation_history)};
  if(message.type==="ehome_ems/save_simulation"){
    simulation.targets=message.targets.map(t=>({...simulation.targets.find(old=>old.id===t.id),...t}));revision="scenario-saved";return {updated:true};
  }
  if(message.type==="ehome_ems/simulate"){
    if(message.budget_w!==1500)throw new Error("Fixture supports only the UI reference budget");
    const result={mode:"manual_scenario",budget_w:1500,allocated_w:1000,remaining_w:500,commands_sent:false,created_at:new Date().toISOString(),
      targets:simulation.targets.map(t=>({...t,allocated_w:t.id==="battery:a"?1000:0,reason:t.id==="battery:a"?"ceiling_reached":"disabled"}))};
    simulation_history.push(result);return result;
  }
  if(message.type==="ehome_ems/remap_source"){
    bindings[message.entity_id].source=message.source_id; revision="two";
    const source=fixtureHass.states[message.source_id];
    fixtureHass.states[message.entity_id]={state:source.state,attributes:{
      ...source.attributes,friendly_name:"Production solaire",data_quality:"valid"}};
    fixturePanel.hass={...fixtureHass};return {updated:true};
  }
  return {id:"simulated-copy"};
 }
};
fixtureHass.states["sensor.pv_source"]={state:"1500",attributes:{unit_of_measurement:"W",friendly_name:"Source solaire"}};
fixtureHass.states["sensor.pv_alternative"]={state:"2000",attributes:{unit_of_measurement:"W",friendly_name:"Source alternative"}};
for(const [id,value] of Object.entries({import:0,export:75,charge:1000,discharge:0,cumulus:200}))
 fixtureHass.states["sensor."+id]={state:String(value),attributes:{unit_of_measurement:"W"}};
for(const [id,value,unit] of [["stock",.16,"kWh"],["aferiy_in",0,"W"],["aferiy_out",0,"W"],["aferiy_soc",72,"%"],["aferiy_stock",1.6,"kWh"],["water_temp",51,"°C"],["water_energy",.62,"kWh"],["fridge",85,"W"],["fridge_energy",.8,"kWh"],["daily_pv",2.1,"kWh"],["daily_home",6.6,"kWh"]])
 fixtureHass.states["sensor."+id]={state:String(value),attributes:{unit_of_measurement:unit}};
window.fixturePanel=document.querySelector("ehome-ems-panel-0-2-0b11");
fixturePanel.hass=fixtureHass;fixturePanel.panel={config:{entry_id:"simulated",revision:"one"}};
</script></html>
