name: Home Assistant beta package
on:
  push:
    branches:
      - codex/v2-measurement-foundation
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ha:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: ["2026.9.1", "2026.11.0b0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "homeassistant==${{ matrix.ha }}"
      - run: python scripts/install_frontend_test_dependencies.py
      - run: python -m unittest discover -s tests -q
      - run: python scripts/validate_home_assistant.py
  package:
    needs: [real-ha, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/build_test_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ehome-ems-0.2.0b9
          path: |
            dist/ehome-ems-0.2.0b9.zip
            dist/ehome-ems-0.2.0b9.zip.sha256
            docs/INSTALLATION_BETA.md
            docs/CONSOMMATION_MAISON.md
            docs/USAGES_OBSERVATION.md
            docs/DASHBOARD_AUTOMATIQUE.md
            docs/DASHBOARD_OBSERVATION.md
            docs/VALIDATION_ASSISTANT.md
            docs/VALIDATION_0_2_0B1.md
          if-no-files-found: error
          retention-days: 90
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-save playwright@1.56.1 @mdi/js@7.4.47
      - run: node scripts/prepare_panel_icons.cjs
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/test_panel_frontend.mjs
      - run: node scripts/validate_panel_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: panel-preview-simulated
          path: artifacts/panel/*.png
