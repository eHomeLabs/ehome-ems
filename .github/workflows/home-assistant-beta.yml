name: Home Assistant package
on:
  push:
    branches:
      - codex/v2-measurement-foundation
      - eHome
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ha:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: ["2026.9.1", "2026.11.0b0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "homeassistant==${{ matrix.ha }}"
      - run: python scripts/install_frontend_test_dependencies.py
      - run: python -m unittest discover -s tests -q
      - run: python scripts/validate_home_assistant.py
  package:
    needs: [real-ha, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/build_test_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ehome-ems-0.2.8
          path: |
            dist/ehome-ems-0.2.8.zip
            dist/ehome-ems-0.2.8.zip.sha256
            docs/INSTALLATION.md
            docs/INSTALLATION_BETA.md
            docs/RELEASE_0_2_8.md
            docs/REVUE_0_2_1.md
            docs/CONSOMMATION_MAISON.md
            docs/USAGES_OBSERVATION.md
            docs/DASHBOARD_AUTOMATIQUE.md
            docs/SIMULATION.md
            docs/DASHBOARD_OBSERVATION.md
            docs/VALIDATION_ASSISTANT.md
            docs/VALIDATION_0_2_0B1.md
          if-no-files-found: error
          retention-days: 90
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-save playwright@1.56.1 @mdi/js@7.4.47
      - run: node scripts/prepare_panel_icons.cjs
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/test_panel_frontend.mjs
      - run: node scripts/validate_panel_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-preview-simulated
          path: artifacts/panel/*.png

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/eHome'
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ehome-ems-0.2.8
          path: release-artifact
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json,re; v=json.load(open("custom_components/ehome_ems/manifest.json"))["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:b[0-9]+)?",v); print(v)' > release-version.txt
          version="$(cat release-version.txt)"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release already exists; preserving it."
          else
            release_flags=()
            if [[ "$version" == *b* ]]; then release_flags+=(--prerelease); fi
            gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${release_flags[@]}" --title "eHome EMS $version" --notes-file docs/RELEASE_0_2_8.md release-artifact/dist/*.zip release-artifact/dist/*.sha256
          fi
